# Place this file at: .github/workflows/deploy.yml (repository root)
#
# Builds the Vite frontend and publishes it to GitHub Pages on every push
# to main. Enable it once under: Settings -> Pages -> Source -> GitHub Actions.
#
# NOTE: this runs on ubuntu-latest, which has a case-sensitive filesystem.
# If the WIshlistContext.jsx casing issue is not fixed, this workflow WILL
# fail at the build step. That is a feature, not a bug — better to catch it
# here than during the recorded demo.

name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apex-tech-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apex-tech-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Set this in: Settings -> Secrets and variables -> Actions -> Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apex-tech-client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
